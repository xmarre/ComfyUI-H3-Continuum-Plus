name: Publish to Comfy registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to publish
        required: true
        type: string
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: continuum-registry-${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  COMFY_CLI_VERSION: "1.13.0"
  COMFY_CLI_WHEEL_SHA256: "190108e4fa4fba44916f12eedbaca9ea685c2f9924c4370210092ccd17e6e5a8"
  COMFY_CLI_CONSTRAINTS: ".github/comfy-cli-1.13.0-py310.constraints.txt"

jobs:
  publish-node:
    name: Publish xmarre H3 Continuum Plus
    if: >-
      github.repository_owner == 'xmarre' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out current release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main

      - name: Resolve published tag and check main is current
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            tag="${REQUESTED_TAG}"
          else
            version="$(python - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
            tag="v${version}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          is_draft="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
          if [[ "${is_draft}" != "false" ]]; then
            echo "Release ${tag} has not been published" >&2
            exit 1
          fi
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq '.sha')"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${tag_sha}" != "${main_sha}" ]]; then
            echo "Release ${tag} does not point to current main; skipping stale publication."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check out published source
        if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify own Registry identity and version
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          p = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          if p["project"]["name"] != "comfyui-h3-continuum-plus":
              raise SystemExit("Refusing Registry publish: unexpected node ID")
          if p["tool"]["comfy"]["PublisherId"] != "xmarre":
              raise SystemExit("Refusing Registry publish: unexpected PublisherId")
          if p["project"]["urls"]["Repository"] != "https://github.com/xmarre/ComfyUI-H3-Continuum-Plus":
              raise SystemExit("Refusing Registry publish: unexpected repository")
          if "v" + p["project"]["version"] != os.environ["RELEASE_TAG"]:
              raise SystemExit("Refusing Registry publish: tag/version mismatch")
          if not os.environ.get("REGISTRY_ACCESS_TOKEN"):
              raise SystemExit("Registry secret REGISTRY_ACCESS_TOKEN is not configured in this repository")
          PY

      - name: Set up Python
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install hash-verified Comfy CLI
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          publish_env="${RUNNER_TEMP}/h3-continuum-publish"
          wheel_dir="${RUNNER_TEMP}/h3-continuum-comfy-cli"
          python -m venv "${publish_env}"
          mkdir -p "${wheel_dir}"
          "${publish_env}/bin/python" -m pip download \
            --disable-pip-version-check --no-deps --only-binary=:all: \
            --dest "${wheel_dir}" "comfy-cli==${COMFY_CLI_VERSION}"
          wheel="${wheel_dir}/comfy_cli-${COMFY_CLI_VERSION}-py3-none-any.whl"
          printf '%s  %s\n' "${COMFY_CLI_WHEEL_SHA256}" "${wheel}" | sha256sum --check --strict
          "${publish_env}/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            --constraint "${COMFY_CLI_CONSTRAINTS}" "${wheel}"
          echo "PUBLISH_COMFY=${publish_env}/bin/comfy" >> "${GITHUB_ENV}"

      - name: Initialize Comfy CLI
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: "${PUBLISH_COMFY} --skip-prompt --no-enable-telemetry env"

      - name: Publish released node to xmarre
        if: steps.release.outputs.publish == 'true'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          "${PUBLISH_COMFY}" node publish --token "${REGISTRY_ACCESS_TOKEN}"
