name: Windows Timeline Desktop validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install native wrapper dependencies
        working-directory: desktop/timeline-native
        run: npm install --no-audit --no-fund
      - name: Verify path bridge and cancellation contracts
        working-directory: desktop/timeline-native
        run: npm test
      - name: Package unsigned Windows portable wrapper
        working-directory: desktop/timeline-native
        run: npm run dist
      - name: Upload unsigned validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Continuum-Timeline-Desktop-Windows-unsigned
          path: desktop/timeline-native/dist/*.exe
          if-no-files-found: error
          retention-days: 7
